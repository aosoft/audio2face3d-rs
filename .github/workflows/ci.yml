name: portable-ci

on:
  # Automatic runs are temporarily paused; run CI manually when needed.
  workflow_dispatch:

jobs:
  portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - name: Install pinned public API tooling
        shell: powershell
        run: ./ci/install-api-tools.ps1
      - name: Run portable release tier
        shell: powershell
        run: ./ci/run-tier.ps1 portable
