name: ci

on:
  pull_request:
  workflow_dispatch:

jobs:
  msrv:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.0
      - name: Cache Cargo dependencies and build outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
            ~/.cargo/git/checkouts
            target
            !target/**/incremental
            !target/doc
          key: cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-rust-1.91.0-${{ hashFiles('Cargo.lock', '**/Cargo.toml', '.cargo/**', '.github/workflows/ci.yml', 'ci/run-tier.ps1') }}
          restore-keys: |
            cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-rust-1.91.0-
      - name: Check minimum supported Rust version
        run: cargo check --workspace --locked --no-default-features --features audio2face3d/mock,audio2face3d/client-grpc,audio2face3d-server/cli,audio2face3d-server/mock --all-targets

      - name: Check desktop gRPC on minimum supported Rust
        run: cargo check --locked -p audio2face3d-gui --no-default-features --features standalone-app,grpc

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - name: Cache Cargo dependencies and build outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
            ~/.cargo/git/checkouts
            target
            !target/**/incremental
            !target/doc
          key: cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-rust-1.97.1-${{ hashFiles('Cargo.lock', '**/Cargo.toml', '.cargo/**', '.github/workflows/ci.yml', 'ci/run-tier.ps1') }}
          restore-keys: |
            cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-rust-1.97.1-
      - name: Run portable release tier
        shell: powershell
        run: ./ci/run-tier.ps1 portable

  macos-grpc:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.0
      - name: Check gRPC app without CUDA or TensorRT
        run: cargo check --locked -p audio2face3d-gui --no-default-features --features standalone-app,grpc --all-targets
      - name: Test portable configuration
        run: cargo test --locked -p audio2face3d --no-default-features --features runtime-cli --test native_build_config

  test-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Install GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev
      - name: Cache Cargo dependencies and build outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
            ~/.cargo/git/checkouts
            target
            !target/**/incremental
            !target/doc
          key: cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-rust-1.97.1-${{ hashFiles('Cargo.lock', '**/Cargo.toml', '.cargo/**', '.github/workflows/ci.yml') }}
          restore-keys: |
            cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-rust-1.97.1-
      - name: Test library, mock server and Linux native loader fixtures
        run: cargo test --workspace --locked --no-default-features --features audio2face3d/cli,audio2face3d/mock,audio2face3d/client-grpc,audio2face3d-server/cli,audio2face3d-server/mock
      - name: Test portable and Linux build configuration
        run: cargo test --locked -p audio2face3d --no-default-features --features runtime-cli --test native_build_config
      - name: Check gRPC GUI without converter, CUDA or TensorRT
        run: cargo check --locked -p audio2face3d-gui --no-default-features --features standalone-app,grpc --all-targets
      - name: Test GUI and OBJ head conversion without CUDA or TensorRT
        run: cargo test --locked -p audio2face3d-gui --no-default-features --features standalone-app,grpc,mock,obj2morph

  build-native:
    name: build-native-${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows
          - os: ubuntu-24.04
            platform: linux
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Install Linux host compiler and GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-13 g++-13 pkg-config libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev
      - name: Fetch TensorRT 10.16 public headers
        uses: actions/checkout@v4
        with:
          repository: NVIDIA/TensorRT
          ref: d0faf303ba766f20cd9fd8c413a112fc2e5a397b
          path: temp/ci-tensorrt
          sparse-checkout: include
          persist-credentials: false
      - name: Cache CUDA build components
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/a2f-native-sdk/downloads
          key: cuda-build-12.9.1-${{ runner.os }}-${{ hashFiles('ci/setup-native-build.ps1') }}
      - name: Configure CUDA and native host compiler
        shell: pwsh
        run: ./ci/setup-native-build.ps1 -SdkDirectory "$env:RUNNER_TEMP/a2f-native-sdk" -TensorRtRoot "$env:GITHUB_WORKSPACE/temp/ci-tensorrt"
      - name: Compile and link native library, server, GUI and test targets (no execution)
        run: cargo build --workspace --locked --all-targets --features audio2face3d/native,audio2face3d/cli,audio2face3d-gui/local
