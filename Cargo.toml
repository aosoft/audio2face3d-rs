[workspace]
resolver = "2"
members = [
    "crates/audio2face3d",
    "crates/audio2face3d-cli",
    "crates/audio2face3d-server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
publish = ["crates-io"]
repository = "https://github.com/aosoft/audio2face3d-rs"
readme = "README.md"

[workspace.dependencies]
audio2face3d = { version = "0.1.0", path = "crates/audio2face3d", default-features = false }
clap = { version = "4.5", features = ["derive"] }
hf-hub = { version = "1.0.0", features = ["blocking", "rustls-tls"] }
sha2 = "0.11"
thiserror = "2.0"
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
