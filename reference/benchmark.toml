fp16_one_track_a2f_total_median_ms = 593.937
fp16_one_track_items_per_second_median = 404.078
fp16_one_track_vs_fp32_speedup = 1.1723
fp16_one_track_latency_reduction_percent = 14.70
fp16_two_tracks_median_ns = 658909500
