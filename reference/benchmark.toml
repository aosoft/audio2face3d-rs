[comparison.cpp_sdk]
benchmark = "BM_RegressionGeometryExecutorOffline"
model = "mark"
precision = "fp32"
execution_option = "None"
a2e_precomputed = true
repetitions = 3
one_track_median_ns = 696301900
one_track_a2f_total_median_ms = 696.295
one_track_items_per_second_median = 344.678
two_tracks_median_ns = 849412000
two_tracks_a2f_total_median_ms = 849.402
two_tracks_items_per_second_median = 565.097
comparison_scope = "The C++ benchmark consumes the complete five-second audio fixture and includes the geometry executor and callback collection. Rust results measure one raw TensorRT inference. They share model, GPU, driver, CUDA, and TensorRT conditions but are not divided into a speed ratio because the timed boundaries differ."
fp16_status = "not-run"
fp16_reason = "The generated C++ SDK fixture does not contain mark/model_fp16.json. The benchmark reported the missing file before the FP16 case could run."

[memory]
scope = "total device memory used"
note = "Windows WDDM did not expose per-process GPU memory through nvidia-smi, so peak memory is the device-wide used-memory sample."
