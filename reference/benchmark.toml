[comparison.cpp_sdk]
benchmark = "BM_RegressionGeometryExecutorOffline"
model = "mark"
precisions = ["fp32", "fp16"]
execution_option = "None"
a2e_precomputed = true
repetitions = 3
one_track_median_ns = 696301900
one_track_a2f_total_median_ms = 696.295
one_track_items_per_second_median = 344.678
two_tracks_median_ns = 849412000
two_tracks_a2f_total_median_ms = 849.402
two_tracks_items_per_second_median = 565.097
comparison_scope = "The C++ benchmark consumes the complete five-second audio fixture and includes the geometry executor and callback collection. Rust results measure one raw TensorRT inference. Each precision uses the same engine in both implementations and shares model, GPU, driver, CUDA, and TensorRT conditions, but results are not divided into a speed ratio because the timed boundaries differ."
fp16_status = "passed"
fp16_engine_sha256 = "7261a77069b319d9f15f8ce368b0be28503b431d7e8c3ad164822187fd73e7b0"
