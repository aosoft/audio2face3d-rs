schema_version = 1

[environment]
manifest = "reference/manifest.toml"
precision = ["fp32", "fp16"]
gpu = "NVIDIA GeForce RTX 3070 Ti Laptop GPU"
driver = "610.88"
cuda_toolkit = "12.9.86"
tensorrt = "10.16.1.11"

[engine_build]
tool = "trtexec"
atomic_output_required = true
command_template = ["trtexec", "--onnx=<network.onnx>", "--saveEngine=<network.trt>"]

[measurement]
status = "passed"
warmup_required = true
percentiles = [50, 95, 99]
record_peak_memory = true
separate_phases = ["build", "cache", "warmup", "steady-state", "post-process", "end-to-end"]

[[results]]
implementation = "rust"
pipeline = "regression-raw-network"
model = "nvidia/Audio2Face-3D-v2.3-Mark"
precision = "fp32"
tracks = 1
warmup_iterations = 5
measured_iterations = 10
build_ns = 345733400
cache_ns = 261900
warmup_ns = { p50 = 3399600, p95 = 45387500, p99 = 45387500 }
steady_state_ns = { p50 = 3462400, p95 = 3804700, p99 = 3804700 }
post_process_ns = { p50 = 100, p95 = 100, p99 = 100 }
end_to_end_ns = { p50 = 3366600, p95 = 3553900, p99 = 3553900 }
peak_gpu_memory_mib = 1552

