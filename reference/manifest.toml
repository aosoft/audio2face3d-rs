factory_paths = ["BlendshapeSolver", "BlendshapeSolverGPU"]
executor_consumers = ["regular skin/tongue", "interactive skin/tongue"]
reference_datasets = ["Mark skin 52", "Mark tongue 16", "test 180"]
reference_sync_async_tests = 12
reference_sync_async_passed = 12
distributed_configs_parsed = 12
cpu_box_constrained_reconstruction = true
