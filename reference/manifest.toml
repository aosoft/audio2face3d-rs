schema_version = 1

[sources.audio2face_sdk]
repository = "https://github.com/NVIDIA/Audio2Face-3D-SDK"
commit = "1ca0f02535ed774f5dbcd724a31cd486368dc783"
generator = "gen_testdata.bat"

[models.regression]
repository = "nvidia/Audio2Face-3D-v2.3-Mark"
revision = "5451728e07378df93b04523279e134a9993ae71b"
license = "NVIDIA Open Model License"
fixture_case = "audio2face-sdk/samples/data/mark"

[models.diffusion]
repository = "nvidia/Audio2Face-3D-v3.0"
revision = "b74132732fd9a9d29b237bec193ded64c9745e91"
license = "NVIDIA Open Model License"
fixture_case = "audio2face-sdk/samples/data/multi-diffusion"

[models.audio2emotion]
repository = "nvidia/Audio2Emotion-v2.2"
revision = "ce1358310179ed7f6b6ea63fe4fa9de5694c1b87"
license = "License Agreement for NVIDIA Audio2Emotion Model for Use with Audio2Face Project"
fixture_case = "audio2emotion-sdk/samples/model"

[environment]
os = "Windows 11"
architecture = "x86_64"
gpu = "NVIDIA GeForce RTX 3070 Ti Laptop GPU"
compute_capability = "8.6"
driver = "610.88"
cuda_toolkit = "12.9.86"
tensorrt = "10.16.1.11"
compiler = "MSVC 19.42.34444.0"
cudnn_direct_dependency = false
dependency_inspection = "dumpbin /dependents"

[[runtime_dependencies]]
component = "audio2x.dll"
libraries = ["cudart64_12.dll", "nvinfer_10.dll", "nvinfer_plugin_10.dll", "cublas64_12.dll", "curand64_10.dll"]
cudnn_found = false

[[runtime_dependencies]]
component = "nvinfer_10.dll"
libraries = ["KERNEL32.dll", "USER32.dll", "SHELL32.dll", "ole32.dll", "ADVAPI32.dll"]
cudnn_found = false

[[runtime_dependencies]]
component = "nvinfer_plugin_10.dll"
libraries = ["nvinfer_10.dll", "KERNEL32.dll"]
cudnn_found = false

[[runs]]
name = "audio2x-common-unit-tests"
command = ["_build/release/audio2x-common/bin/audio2x-common-unit-tests.exe", "--gtest_brief=1"]
working_directory = "sdk-root"
status = "passed"
passed = 54
failed = 0

[[runs]]
name = "sample-a2f-executor"
command = ["_build/release/audio2face-sdk/bin/sample-a2f-executor.exe"]
working_directory = "sdk-root"
status = "passed"
note = "Regression and diffusion completed for eight tracks."

[[runs]]
name = "audio2emotion-unit-tests"
command = ["_build/release/audio2emotion-sdk/bin/audio2emotion-unit-tests.exe", "--gtest_brief=1"]
working_directory = "sdk-root"
status = "known-failure"
note = "Interactive executor tests request a batch larger than the generated TensorRT engine profile. The run was stopped after reproducing the mismatch."

[reproducibility]
command = ["cargo", "run", "--manifest-path", "reference/Cargo.toml", "--", "--sdk-root", "<sdk-root>"]
artifact_manifest = "reference/artifacts.json"
deterministic_sources = true
engine_hash_deterministic = false
engine_nondeterminism_reason = "TensorRT tactics and serialized engines depend on the GPU, driver, TensorRT version, and builder environment."

[validation.milestone2.cpp_reference]
fixture_sha256 = "4224e2ba9fc3985ef106ee7bd2959988fc38cbe46828484361d6c6ae7cf6dc5f"
engine_sha256 = "5caf6d0f29a5ae8f4afcba03a04ddfacc16d2f0b4b4dae2a9b1ae657c49b1daf"
absolute_tolerance = 0.001
all_elements_match = true

[validation.milestone2.a2f_fp32]
model = "audio2face-3d-v2.3-mark"
engine_sha256 = "81d12167c8219125637aec55ec66cad50539d3e4c78a99626657b4eff4285cd9"
named_multi_io = true
dynamic_batch = true
enqueue_succeeded = true

[validation.milestone2.a2f_fp16]
model = "audio2face-3d-v2.3-mark"
engine_sha256 = "65513d7e8224387c4d049dcc3dab3695965af6b2f4ec086be65b96a49748707d"
build_flag = "--fp16"
dynamic_batch = true
enqueue_succeeded = true
note = "TensorRT retained FP32 I/O and selected FP16 internally, with precision-sensitive layernorm operations promoted to FP32."

[validation.milestone2.profiler]
tool = "Nsight Systems 2025.1.3"
trace = ["cuda", "nvtx"]
reference_test_h2d_operations = 3
reference_test_d2h_operations = 2
unexpected_host_round_trip = false
host_synchronization_contract = "Only explicit fixture upload/download, completion fence wait, and TensorRT lifecycle operations synchronize the host."

[validation.milestone4.regression]
model = "audio2face-3d-v2.3-mark"
track_boundaries = [1, 2, 32]
real_engine_single_track = true
real_engine_batch_two = true
cpu_gpu_postprocess_parity = true
callback_interrupt = true
wait_and_resume = true
drop_watermark = true
device_output_fence = true
host_round_trip_inside_device_postprocess = false
test_command = "cargo test --workspace --all-features"

[validation.milestone5.diffusion]
model = "audio2face-3d-v3.2-multi-diffusion"
engine_sha256 = "be5a5fbdb4884b80a2719ee3f74c2e561009739e19c81bd57662b35afe6c08de"
bindings = ["emotion", "identity", "input_latents", "noise", "window", "output_latents", "prediction"]
real_engine_single_track = true
multi_frame_callback_order = "frame-major-then-track"
recurrent_swap_copy_reset = true
skipped_track_state_preserved = true
callback_stop_is_track_local = true
philox_cpu_replay = true
philox_gpu_replay = true
philox_gpu_track_isolation = true
normal_distribution_statistical_test = true
geometry_postprocess = ["skin", "tongue", "jaw", "eyes"]
test_command = "cargo test --workspace --all-features"
