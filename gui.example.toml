# Copy to gui.toml in the working directory or next to the executable.
# Selection: --config PATH > working-directory gui.toml > executable-directory gui.toml.
# All paths below are relative to THIS file, not the working directory.
# Uncomment for local inference; SDK settings stay in the shared file.
# platform-config = "platform.toml"

# Recommended location for a converted ICT-FaceKit head; uncomment after conversion.
# Omit head to use assets/default-head.glb next to the executable.
# head = "models/heads/ict-facekit.glb"

[inference]
mode = "grpc" # Use "local" with a local-enabled build.
# wav = "audio/sample.wav"
play-while-inferring = false
stream-buffer-ms = 100 # Startup/rebuffer target; 10..10000 ms, streaming only.
auto-start = false

[local]
# model = "models/mark/model.json"
device = 0

[grpc]
endpoint = "http://127.0.0.1:52000"
api-key = ""

# Emotion is a default feature. Uncomment only in emotion-enabled builds.
# Local: omit model for inference without Audio2Emotion/emotion overrides.
# gRPC: the model is selected on the SERVER; send-to-server enables overrides.
# [emotion]
# model = "models/emotion/model.json"
# send-to-server = false
# transition-time = 0.5
# contrast = 1.0
# smoothing = 0.7
# use-preferred = false
# preferred-strength = 1.0
# strength = 1.0
# max-emotions = 3
# [emotion.beginning]
# joy = 0.8
