[package]
name = "audio2face3d-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Audio2Face-3D compatible gRPC server"

[package.metadata.docs.rs]
default-features = false
features = ["mock"]

[features]
default = ["native"]
native = ["audio2face3d/native"]
mock = ["audio2face3d/mock"]
cli = ["dep:serde_json", "dep:tracing-subscriber", "dep:tracing", "audio2face3d/runtime-cli", "dep:subtle", "dep:clap", "tokio/signal"]

[dependencies]
serde_json = { workspace = true, optional = true }
tracing-subscriber = { version = "0.3.23", optional = true, default-features = false, features = ["registry", "fmt"] }
subtle = { version = "2.6.1", optional = true }
audio2face3d = { version = "0.1.0", path = "../audio2face3d", default-features = false, features = ["grpc-server"] }
clap = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time", "net"] }
tokio-stream = { version = "0.1.18", features = ["net"] }
tokio-util = { version = "0.7.18", features = ["rt"] }
tonic = "=0.14.6"
tonic-health = "=0.14.6"
prost = "=0.14.4"
prost-types = "=0.14.4"

[lints]
workspace = true

[[bin]]
name = "audio2face3d-server"
path = "src/main.rs"
required-features = ["cli"]

[dev-dependencies]
h2 = "0.4.18"
http = "1.4.0"
audio2face3d = { path = "../audio2face3d", default-features = false, features = ["client-grpc"] }
