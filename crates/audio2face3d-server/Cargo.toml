[package]
name = "audio2face3d-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Audio2Face-3D compatible gRPC server"

[features]
default = []
runtime = ["dep:audio2face3d", "audio2face3d/animation", "audio2face3d/emotion", "audio2face3d/tensorrt"]

[dependencies]
audio2face3d = { workspace = true, optional = true }
clap.workspace = true
tracing.workspace = true
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net"] }
tokio-stream = { version = "0.1.18", features = ["net"] }
tokio-util = { version = "0.7.18", features = ["rt"] }
tonic = "=0.14.6"
tonic-prost = "=0.14.6"
tonic-health = "=0.14.6"
prost = "=0.14.4"
prost-types = "=0.14.4"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[build-dependencies]
tonic-prost-build = "=0.14.6"
protoc-bin-vendored = "=3.2.0"

[lints]
workspace = true
