[package]
name = "audio2face3d-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Audio2Face-3D inspection library and desktop application"

[features]
default = []
local = ["audio2face3d/native"]
grpc = ["audio2face3d/client-grpc", "dep:tokio"]
mock = ["audio2face3d/mock"]
capture = ["desktop", "dep:image"]
render-wgpu = ["dep:wgpu", "dep:bytemuck", "dep:glam"]
ui-egui = ["dep:egui"]
desktop = ["render-wgpu", "ui-egui", "dep:eframe", "dep:egui-wgpu", "dep:cpal", "dep:rfd", "dep:clap", "dep:windows-sys", "audio2face3d/runtime-cli"]

[dependencies]
audio2face3d.workspace = true
clap = { workspace = true, optional = true }
audio2face3d-gui-core = { path = "../audio2face3d-gui-core", features = ["gltf-read"] }
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
hound = "=3.5.1"
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "time", "net"], optional = true }
wgpu = { version = "24", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }
glam = { version = "0.30", optional = true }
egui = { version = "=0.31.1", optional = true }
egui-wgpu = { version = "=0.31.1", default-features = false, optional = true }
eframe = { version = "=0.31.1", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"], optional = true }
cpal = { version = "=0.15.3", optional = true }
rfd = { version = "0.15", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", optional = true, features = ["Win32_System_Console"] }

[dev-dependencies]
pollster = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }

[[example]]
name = "capture_head"
required-features = ["render-wgpu"]

[[example]]
name = "head_atlas"
required-features = ["render-wgpu"]

[[example]]
name = "audio_probe"
required-features = ["desktop"]

[[example]]
name = "stream_probe"
required-features = ["desktop"]

[[bin]]
name = "audio2face3d-gui"
required-features = ["desktop"]

[lints]
workspace = true
