[package]
name = "audio2x-cuda"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
build = "build.rs"

[features]
default = []
cuda = ["dep:cudarc"]

[dependencies]
audio2x-core.workspace = true
tracing.workspace = true
cudarc = { version = "0.19", optional = true, features = ["driver", "cublas", "curand", "cuda-version-from-build-system", "dynamic-linking"], default-features = false }

[dev-dependencies]
trybuild = "1.0"

[lints]
workspace = true
