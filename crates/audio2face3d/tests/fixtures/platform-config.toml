cuda-root = 'shared/cuda'
tensorrt-root = 'shared/trt'

[build-cuda]
cuda-root = 'build/cuda'
[build-cuda.linux]
cuda-host-compiler = 'build/compiler'

[build-cuda.windows]
visual-studio-root = 'build/vs'
msvc-toolset-version = '14.42.34433'

[runtime]
cuda-library-dirs = ['deploy/cuda']
tensorrt-root = 'deploy/trt'
search-policy = 'explicit'
