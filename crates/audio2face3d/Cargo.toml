[package]
name = "audio2face3d"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT AND MPL-2.0 AND Apache-2.0"
publish.workspace = true
repository.workspace = true
readme.workspace = true
description = "Unofficial Rust runtime for NVIDIA Audio2Face-3D and Audio2Emotion"
keywords = ["audio2face", "animation", "cuda", "tensorrt"]
categories = ["multimedia", "api-bindings"]
build = "build.rs"

[package.metadata.docs.rs]
all-features = false
default-features = true

[features]
tracing = ["dep:tracing", "dep:tracing-subscriber"]
default = []
animation = ["dep:thiserror", "tracing", "dep:serde", "dep:serde_json", "dep:zip"]
emotion = ["animation"]
cuda = ["animation", "dep:cudarc", "dep:cc", "dep:toml"]
tensorrt = ["cuda"]
mock = ["tracing"]
native = ["animation", "emotion", "tensorrt"]
client-grpc = ["tracing", "dep:prost", "dep:prost-types", "dep:tonic", "dep:tonic-prost", "dep:tokio", "dep:tokio-stream", "dep:tonic-prost-build", "dep:protoc-bin-vendored"]
grpc-server = ["tracing", "dep:prost", "dep:prost-types", "dep:tonic", "dep:tonic-prost", "dep:tonic-prost-build", "dep:protoc-bin-vendored"]
cli = ["dep:clap", "dep:hf-hub", "dep:sha2", "dep:thiserror", "dep:serde", "dep:serde_json", "tracing", "dep:zip"]
[dependencies]
tracing-subscriber = { version = "0.3.23", optional = true, default-features = false, features = ["registry"] }
thiserror = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
hf-hub = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
cudarc = { version = "0.19", optional = true, features = ["driver", "cublas", "curand", "cuda-version-from-build-system", "dynamic-linking"], default-features = false }
zip = { version = "8.6.0", optional = true, default-features = false, features = ["deflate-flate2-zlib-rs"] }
prost = { version = "=0.14.4", optional = true }
prost-types = { version = "=0.14.4", optional = true }
tonic = { version = "=0.14.6", optional = true }
tonic-prost = { version = "=0.14.6", optional = true }
tokio = { version = "1.53.1", features = ["rt", "sync", "time", "net", "macros"], optional = true }
tokio-stream = { version = "0.1.18", optional = true }
[build-dependencies]
toml = { version = "1.1", optional = true, default-features = false, features = ["parse", "std", "serde"] }
cc = { version = "1.2", optional = true }
tonic-prost-build = { version = "=0.14.6", optional = true }
protoc-bin-vendored = { version = "=3.2.0", optional = true }
[dev-dependencies]
toml = { version = "1.1", default-features = false, features = ["parse", "std", "serde"] }
tokio = { version = "1.53.1", features = ["macros", "rt", "rt-multi-thread"] }
trybuild = "1.0"
[[bin]]
name = "audio2face3d"
path = "src/main.rs"
required-features = ["cli"]
[lints]
workspace = true

[[example]]
name = "stream"
required-features = ["mock"]
