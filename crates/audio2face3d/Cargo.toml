[package]
name = "audio2face3d"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT AND MPL-2.0"
publish.workspace = true
repository.workspace = true
readme.workspace = true
description = "Unofficial Rust runtime for NVIDIA Audio2Face-3D and Audio2Emotion"
keywords = ["audio2face", "animation", "cuda", "tensorrt"]
categories = ["multimedia", "api-bindings"]
build = "build.rs"

[package.metadata.docs.rs]
all-features = false
default-features = true

[features]
default = ["animation", "emotion"]
animation = []
emotion = ["animation"]
cuda = ["dep:cudarc"]
tensorrt = ["cuda"]

[dependencies]
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
cudarc = { version = "0.19", optional = true, features = ["driver", "cublas", "curand", "cuda-version-from-build-system", "dynamic-linking"], default-features = false }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt"] }
trybuild = "1.0"

[lints]
workspace = true
