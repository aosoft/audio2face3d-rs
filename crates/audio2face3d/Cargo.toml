[package]
name = "audio2face3d"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT AND MPL-2.0 AND Apache-2.0"
publish.workspace = true
repository.workspace = true
readme.workspace = true
description = "Unofficial Rust port of NVIDIA Audio2Face-3D SDK with client and server support"
keywords = ["audio2face", "animation", "cuda", "tensorrt"]
categories = ["multimedia", "api-bindings"]
build = "build.rs"

[package.metadata.docs.rs]
all-features = false
default-features = true

[features]
default = []
animation = ["dep:thiserror", "dep:serde", "dep:serde_json", "dep:zip"]
emotion = ["animation"]
cuda = ["animation", "dep:cudarc", "dep:cc", "dep:toml", "dep:libloading", "dep:windows-sys", "dep:libc"]
tensorrt = ["cuda"]
mock = []
native = ["animation", "emotion", "tensorrt"]
client-grpc = ["dep:prost", "dep:prost-types", "dep:tonic", "dep:tonic-prost", "dep:tokio", "dep:tokio-stream", "dep:tonic-prost-build", "dep:protoc-bin-vendored"]
grpc-server = ["dep:prost", "dep:prost-types", "dep:tonic", "dep:tonic-prost", "dep:tonic-prost-build", "dep:protoc-bin-vendored"]
runtime-cli = [ "dep:clap", "dep:toml", "dep:libloading", "dep:windows-sys", "dep:libc"]
cli-logging = ["dep:chrono", "dep:tracing", "dep:tracing-subscriber", "dep:serde", "dep:serde_json", "dep:clap"]
cli = ["cli-logging", "runtime-cli", "dep:clap", "dep:hf-hub", "dep:sha2", "dep:thiserror", "dep:serde", "dep:serde_json", "dep:zip"]
[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"], optional = true }
toml = { version = "1.1", optional = true, default-features = false, features = ["parse", "std", "serde"] }
libloading = { version = "0.9", optional = true }
tracing-subscriber = { version = "0.3.23", optional = true, default-features = false, features = ["registry", "fmt"] }
thiserror = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
hf-hub = { version = "1.0.0", features = ["blocking", "rustls-tls"], optional = true }
sha2 = { workspace = true, optional = true }
cudarc = { version = "0.19", optional = true, features = ["driver", "cublas", "curand", "cuda-12090", "dynamic-loading"], default-features = false }
zip = { version = "8.6.0", optional = true, default-features = false, features = ["deflate-flate2-zlib-rs"] }
prost = { version = "=0.14.4", optional = true }
prost-types = { version = "=0.14.4", optional = true }
tonic = { version = "=0.14.6", optional = true }
tonic-prost = { version = "=0.14.6", optional = true }
tokio = { version = "1.53.1", features = ["rt", "sync", "time", "net", "macros"], optional = true }
tokio-stream = { version = "0.1.18", optional = true }
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", optional = true, features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp"] }
[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp"] }
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
[build-dependencies]
toml = { version = "1.1", optional = true, default-features = false, features = ["parse", "std", "serde"] }
cc = { version = "1.2", optional = true }
tonic-prost-build = { version = "=0.14.6", optional = true }
protoc-bin-vendored = { version = "=3.2.0", optional = true }
[dev-dependencies]
tracing.workspace = true
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry", "fmt"] }
libloading = "0.9"
toml = { version = "1.1", default-features = false, features = ["parse", "std", "serde"] }
tokio = { version = "1.53.1", features = ["macros", "rt", "rt-multi-thread"] }
trybuild = "1.0"
[[bin]]
name = "audio2face3d"
path = "src/main.rs"
required-features = ["cli"]
[lints]
workspace = true

[[example]]
name = "stream"
required-features = ["mock"]

